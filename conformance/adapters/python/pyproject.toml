[project]
name = "conformance-adapter"
version = "0.1.0"
description = "Python adapter for the SEP-2624 interceptors conformance suite (binds the WG feature/python-sdk to the shared language-neutral fixtures)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    # The WG Python SDK under certification, vendored read-only from
    # upstream/feature/python-sdk by scripts/vendor.sh (see [tool.uv.sources]).
    "mcp-ext-interceptors",
    "anyio>=4.9",
    "pydantic>=2.12.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# mcp 2.0.0b1 pins mcp-types==2.0.0b1; allow that transitive pre-release pin.
prerelease = "allow"

[tool.uv.sources]
mcp-ext-interceptors = { path = "_vendor/wg-python-sdk", editable = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformance_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

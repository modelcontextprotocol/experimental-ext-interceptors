name: Integrations CI
on:
  push:
    branches: [main]
    paths:
      - 'integrations/**'
      - 'typescript/**'
      - '.github/workflows/integrations.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - 'typescript/**'
      - '.github/workflows/integrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langgraph:
    name: "LangGraph binding"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build the SDK (consumed as a built package by the integration)
        run: |
          cd typescript/sdk
          npm install
          npm run build
      - name: Install the integration
        run: |
          cd integrations/langgraph
          npm install
      - name: Typecheck
        run: |
          cd integrations/langgraph
          npm run typecheck
      - name: Run tests
        run: |
          cd integrations/langgraph
          npm test
      - name: Demo asserts the secret never crosses the boundary
        # The demo runs .ts directly via node --experimental-strip-types, which
        # requires Node >= 22. Tests and typecheck cover the Node 20 matrix leg.
        if: matrix.node-version == '22'
        run: |
          cd integrations/langgraph
          npm run demo | tee /tmp/demo.txt
          grep -q "the secret never crossed the boundary under interceptors." /tmp/demo.txt
